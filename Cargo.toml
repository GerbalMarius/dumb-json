[package]
name = "dumb-json"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"

[workspace]
members = [
    "crates/djson", "crates/djson-derive",
]
resolver = "2"

[dependencies]
djson = { path = "crates/djson", default-features = false }

[features]
default = ["djson/ordered"]
unordered = ["djson/unordered"]
ordered = ["djson/ordered"]
sorted = ["djson/sorted"]